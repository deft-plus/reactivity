name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Verify dependencies
        run: deno ci

      - name: Lint and format
        run: deno task lint

      - name: Type-check
        run: deno task check

      - name: Validate JSDoc
        run: deno task jsdoc:lint

      - name: Run tests
        run: deno task test
