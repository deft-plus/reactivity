name: Lint PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(\[unstable\] (BREAKING|deprecation)|BREAKING|deprecation|feature|release|fix|docs|refactor|perf|test|ci|chore|revert): [a-z].*$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Invalid pull request title: $PR_TITLE"
            echo
            echo "Use one of these formats with a lowercase subject:"
            echo "  BREAKING: title..."
            echo "  [unstable] BREAKING: title..."
            echo "  deprecation: title..."
            echo "  [unstable] deprecation: title..."
            echo "  feature: title..."
            echo "  release: title..."
            echo "  fix: title..."
            echo "  docs: title..."
            echo "  refactor: title..."
            echo "  perf: title..."
            echo "  test: title..."
            echo "  ci: title..."
            echo "  chore: title..."
            echo "  revert: title..."
            exit 1
          fi
